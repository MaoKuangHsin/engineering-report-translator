<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="light dark"/>
<link rel="icon" href="data:,"/>
<title>Engineering Report Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem}
*{box-sizing:border-box}
:root{
--bg:#f6f7f9;--surface:#fff;--surface2:#f1f3f6;--ink:#101828;--muted:#667085;--line:#e4e7ec;
--navy:#0b2a4a;--accent:#0b4f6c;--accent2:#0e7a6b;--accent-ink:#fff;
--tech:#8a5a12;--tech-bg:#fdf6e3;--tech-line:#ead9a6;
--biz:#0e7a6b;--biz-bg:#eaf7f3;--biz-line:#bfe6dc;
--warn:#9a3412;--warn-bg:#fff4ed;--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);--radius:12px
}
@media(prefers-color-scheme:dark){
:root{--bg:#0c1118;--surface:#151c26;--surface2:#1c2634;--ink:#eaecf0;--muted:#98a2b3;--line:#2a3648;--navy:#d6e6f2;--accent:#2a7ca6;--accent2:#2fbfa8;--tech:#e3b34e;--tech-bg:#2b2413;--tech-line:#57471d;--biz:#4cc3ab;--biz-bg:#12302a;--biz-line:#1f5246;--warn:#fdb08a;--warn-bg:#382016;--shadow:0 1px 3px rgba(0,0,0,.4)}
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC","Noto Sans JP",system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 56px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.eyebrow{font-size:.72rem;letter-spacing:.14em;font-weight:700;color:var(--accent2);text-transform:uppercase;margin-bottom:6px}
h1{font-size:clamp(1.65rem,4vw,2.3rem);line-height:1.15;margin:0 0 8px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
.lede{margin:0;color:var(--muted);max-width:52em;font-size:.98rem}
.lang-switch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
.lang-switch span{font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--muted);padding-left:8px}
.lang-switch button{font:inherit;font-size:.88rem;font-weight:600;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:999px;padding:6px 13px;cursor:pointer}
.lang-switch button.active{background:var(--navy);color:#fff}
@media(prefers-color-scheme:dark){.lang-switch button.active{background:#fff;color:#101828}}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.steps span{font-size:.84rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted)}
.steps b{color:var(--accent2)}
.controls{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:18px;display:grid;gap:14px}
@media(min-width:960px){.controls{grid-template-columns:1.15fr 1fr 1fr 1.25fr;align-items:end}}
.ctl label,.ctl-label{display:block;font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ctl input{width:100%;padding:8px 12px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.88rem;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.seg button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.workspace{display:grid;gap:18px}
@media(min-width:900px){.workspace{grid-template-columns:1fr 1fr;align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:.95rem;margin:0;font-weight:700;letter-spacing:.01em}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.07em;border-radius:5px;padding:3px 8px;white-space:nowrap}
.tag.tech{background:var(--tech-bg);color:var(--tech);border:1px solid var(--tech-line)}
.tag.biz{background:var(--biz-bg);color:var(--biz);border:1px solid var(--biz-line)}
.panel-body{padding:16px}
textarea{width:100%;min-height:240px;resize:vertical;font-family:"JetBrains Mono","Noto Sans TC","Noto Sans JP",monospace;font-size:.9rem;line-height:1.7;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.count{font-size:.8rem;color:var(--muted)}
.link-btn{background:none;border:none;color:var(--muted);cursor:pointer;font:inherit;font-size:.85rem;text-decoration:underline}
.examples{margin-top:14px}.examples p{margin:0 0 8px;font-size:.78rem;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.examples .row{display:flex;flex-wrap:wrap;gap:8px}
.ex-btn{font:inherit;font-size:.87rem;cursor:pointer;padding:7px 12px;border-radius:8px;background:var(--surface);border:1px dashed var(--line);color:var(--ink)}
.ex-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.translate-row{display:flex;gap:10px;margin-top:16px}
.btn{font:inherit;font-size:.92rem;font-weight:600;cursor:pointer;border-radius:8px;padding:9px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;flex:1;min-width:180px}
@media(prefers-color-scheme:dark){.btn.primary{background:#eaecf0;color:#101828;border-color:#eaecf0}}
.btn.small{font-size:.85rem;padding:6px 13px}
.detected{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.detected h3{font-size:.82rem;margin:0 0 8px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:.82rem;border-radius:999px;padding:4px 11px;background:var(--tech-bg);border:1px solid var(--tech-line)}
.chip b{color:var(--tech)}.chip .arr{color:var(--muted);margin:0 3px}.chip i{font-style:normal;color:var(--biz);font-weight:700}
.none-note{font-size:.85rem;color:var(--muted)}
.report-empty{color:var(--muted);font-size:.94rem;padding:8px 2px}.report-empty strong{color:var(--ink)}
.headline-box{background:var(--biz-bg);border:1px solid var(--biz-line);border-radius:8px;padding:13px 15px;margin-bottom:16px}
.headline-box .k{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--biz);text-transform:uppercase;margin-bottom:3px}
.headline-box .v{font-weight:700;font-size:1.03rem;line-height:1.55}
.headline-box .v-sub{font-size:.88rem;color:var(--muted);margin-top:4px}
.rsec{margin-bottom:16px}.rsec h3{font-size:.88rem;margin:0 0 7px;display:flex;align-items:center;gap:8px}
.rsec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.rsec ul{margin:0;padding-left:1.25em}.rsec li{margin-bottom:5px;font-size:.94rem}
.rsec li .sub,.rsec p .sub{display:block;font-size:.84rem;color:var(--muted)}
.rsec p{margin:0 0 6px;font-size:.94rem}.rsec.warn h3{color:var(--warn)}
.data-num{font-weight:700;color:var(--biz)}
.slide-title{font-size:1.28rem;font-weight:800;line-height:1.45;margin:2px 0 4px;letter-spacing:-.01em}
.slide-title-sub{color:var(--muted);font-size:.93rem;margin-bottom:12px}
.email-subject{font-weight:700;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 13px;margin-bottom:12px;font-size:.94rem}
.out-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.out-actions[hidden]{display:none}
.copy-ok{color:var(--biz);font-size:.85rem;font-weight:700}
.below{display:grid;gap:18px;margin-top:18px}
@media(min-width:900px){.below{grid-template-columns:1.5fr 1fr;align-items:start}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2{font-size:1rem;margin:0 0 4px;font-weight:800}
.card .card-sub{color:var(--muted);font-size:.87rem;margin:0 0 12px}
.gloss-table{width:100%;border-collapse:collapse;font-size:.88rem}
.gloss-table th,.gloss-table td{text-align:left;padding:7px 8px;vertical-align:top}
.gloss-table thead th{font-size:.74rem;letter-spacing:.05em;color:var(--muted);border-bottom:2px solid var(--line);text-transform:uppercase}
.gloss-table tbody tr{border-bottom:1px solid var(--line)}
.gloss-table td.tech-cell{font-family:"JetBrains Mono",monospace;font-size:.8rem;color:var(--tech);font-weight:600}
.gloss-table td.biz-cell{font-weight:700;color:var(--biz)}
.formula{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-weight:700;text-align:center;margin-bottom:14px;font-size:.95rem}
.formula span{color:var(--accent2)}
.tips{margin:0;padding-left:1.25em;font-size:.92rem}.tips li{margin-bottom:10px}
.tips .before{font-family:"JetBrains Mono",monospace;font-size:.8rem;color:var(--tech)}
.tips .after{color:var(--biz);font-weight:500}
footer.note{margin-top:26px;color:var(--muted);font-size:.8rem;text-align:center}
.site-credit{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;line-height:1.6;text-align:center;letter-spacing:.01em}
.site-credit strong{color:var(--ink);font-weight:600}
@media print{.controls,.examples,.translate-row,.out-actions,.lang-switch,.no-print{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <header>
      <div class="eyebrow" id="uiEyebrow">Workplace Reporting Tool</div>
      <h1 id="uiTitle">Engineering Report Translator</h1>
      <p class="lede" id="uiLede"></p>
      <div class="steps" id="uiSteps"></div>
    </header>
    <div class="lang-switch" role="group" aria-label="Interface language">
      <span id="uiLangLabel">Language</span>
      <button type="button" data-ui="en" class="active">English</button>
      <button type="button" data-ui="zh">繁體中文</button>
      <button type="button" data-ui="ja">日本語</button>
    </div>
  </div>

  <section class="controls" aria-label="Report settings">
    <div class="ctl"><label for="projectName" id="lblProject">Project name (optional)</label><input type="text" id="projectName" autocomplete="off"/></div>
    <div class="ctl"><span class="ctl-label" id="lblAudience">Audience</span><div class="seg" id="segAudience" role="group"></div></div>
    <div class="ctl"><span class="ctl-label" id="lblFormat">Format</span><div class="seg" id="segFormat" role="group"></div></div>
    <div class="ctl"><span class="ctl-label" id="lblOutLang">Report language</span><div class="seg" id="segLang" role="group"></div></div>
  </section>

  <div class="workspace">
    <section class="panel" aria-label="Source notes">
      <div class="panel-head"><h2 id="uiInputTitle">Your notes</h2><span class="tag tech">TECH SPEAK</span></div>
      <div class="panel-body">
        <textarea id="input"></textarea>
        <div class="meta-row"><span class="count" id="inputCount"></span><button type="button" class="link-btn" id="clearBtn"></button></div>
        <div class="examples"><p id="uiExamplesLabel"></p><div class="row">
          <button type="button" class="ex-btn" data-sample="ai" id="exAi"></button>
          <button type="button" class="ex-btn" data-sample="launch" id="exLaunch"></button>
          <button type="button" class="ex-btn" data-sample="ja" id="exJa"></button>
        </div></div>
        <div class="translate-row"><button type="button" class="btn primary" id="translateBtn"></button></div>
        <div class="detected"><h3 id="uiDetectedTitle"></h3><div class="chips" id="detectedChips"></div></div>
      </div>
    </section>
    <section class="panel" aria-label="Report output">
      <div class="panel-head"><h2 id="uiOutputTitle">Report</h2><span class="tag biz">EXECUTIVE READY</span></div>
      <div class="panel-body">
        <div id="output"></div>
        <div class="out-actions" id="outActions" hidden>
          <button type="button" class="btn small" id="copyBtn"></button>
          <button type="button" class="btn small" id="downloadBtn"></button>
          <span class="copy-ok" id="copyOk" hidden></span>
        </div>
      </div>
    </section>
  </div>

  <div class="below">
    <section class="card"><h2 id="uiGlossTitle"></h2><p class="card-sub" id="uiGlossSub"></p>
      <table class="gloss-table"><thead><tr><th id="gCol1"></th><th id="gCol2"></th><th id="gCol3"></th></tr></thead><tbody id="glossBody"></tbody></table>
    </section>
    <section class="card"><h2 id="uiTipsTitle"></h2><p class="card-sub" id="uiTipsSub"></p><div class="formula" id="uiFormula"></div><ul class="tips" id="tipsList"></ul></section>
  </div>
  <footer class="note" id="uiFooter"></footer>
  <footer class="site-credit" id="uiCredit"></footer>
</div>

var zh=polishZh(line);return{zh:zh,en:zhToEnFallback(line),ja:zhToJa(line)}
}
function highlightNums(s){return esc(s).replace(/(\d[\d,]*(?:\.\d+)?\s*(?:%|ms|秒|小時|分鐘|hours?|mins?|x|倍)?)/g,function(m){return /\d/.test(m)&&m.trim()?'<span class="data-num">'+m+"</span>":m})}

/* ============ Report building ============ */
var HEAD={
en:{manager:"This week's highlight: ",executive:"Key result this period: ",cross:"Progress highlight: ",client:"Latest update: "},
zh:{manager:"本週重點：",executive:"本期重點成果：",cross:"進度重點：",client:"最新進度："},
ja:{manager:"今週のハイライト：",executive:"今期の主要成果：",cross:"進捗のハイライト：",client:"最新の進捗："}
};
var SECT={
done:{en:"Completed this period",zh:"本期完成",ja:"今期の完了事項"},
data:{en:"Key results",zh:"關鍵成果（數據）",ja:"主な成果（数値）"},
impact:{en:"Business impact",zh:"業務影響",ja:"ビジネスへの影響"},
risk:{en:"Issues & risks",zh:"問題與風險",ja:"課題とリスク"},
next:{en:"Next steps",zh:"下一步",ja:"次のステップ"},
help:{en:"Support required",zh:"需要協助",ja:"支援が必要な事項"},
headline:{en:"Executive summary",zh:"重點摘要",ja:"エグゼクティブサマリー"},
three:{en:"Three key points",zh:"三個重點",ja:"3つの要点"},
concl:{en:"Bottom line",zh:"結論",ja:"結論"},
notes:{en:"Speaker notes: risks & next steps",zh:"講者備註：風險與下一步",ja:"補足：リスクと次のステップ"},
myWins:{en:"What I delivered",zh:"本期交付成果",ja:"今期の成果"},
myBlock:{en:"Current blockers",zh:"目前阻礙",ja:"現在の阻害要因"},
myAsk:{en:"Decisions / support requested",zh:"待確認事項／需要協助",ja:"確認・支援依頼事項"},
progUp:{en:"Progress update",zh:"進度更新",ja:"進捗報告"}
};
function secTitle(key,lang){return SECT[key][lang]}
function buildReport(raw){
var lines=raw.split(/\n+/).map(function(l){return l.replace(/^[\s\-•*·\d.、)）]+/,"").trim()}).filter(function(l){return l.length});
if(!lines.length)return null;
var buckets={done:[],data:[],risk:[],next:[],help:[]};
lines.forEach(function(l){var c=classify(l);var conv=convertLine(l);conv.cat=c;buckets[c].push(conv)});
var terms=detectTerms(raw);var proj=$("projectName").value.trim();
function headFor(lang){var it=buckets.data[0]||buckets.done[0]||buckets.next[0]||buckets.risk[0];if(!it)return"";var base=it[lang].replace(/[。．.]$/,"");var h=HEAD[lang][state.audience]+base;if(lang==="en"&&!/^Next step/i.test(base)&&state.audience) h=h; if(proj)h=(lang==="ja"?"「"+proj+"」":lang==="zh"?"「"+proj+"」":proj+" — ")+h; if(lang==="ja"&&!/[。]$/.test(h))h+="。"; if(lang==="zh"&&!/[。]$/.test(h))h+="。"; if(lang==="en"&&!/[.]$/.test(h))h+="."; return h}
return{buckets:buckets,terms:terms,proj:proj,head:{en:headFor("en"),zh:headFor("zh"),ja:headFor("ja")}}
}
function impactItems(r){var items=[],seen={};r.terms.forEach(function(g){if(seen[g.tech])return;seen[g.tech]=1;items.push({en:g.impEn,zh:g.impZh,ja:g.impJa})});return items.slice(0,4)}
function secHTML(key,items,warn){
if(!items.length)return"";var p=outPrimary(),s=outSecondary();
var h='<div class="rsec'+(warn?" warn":"")+'"><h3>'+esc(secTitle(key,p))+(s?' <span style="font-weight:400;color:var(--muted);font-size:.8rem">'+esc(secTitle(key,s))+"</span>":"")+"</h3><ul>";
items.forEach(function(it){h+="<li>"+highlightNums(it[p])+(s&&it[s]!==it[p]?'<span class="sub">'+esc(it[s])+"</span>":"")+"</li>"});
return h+"</ul></div>"}
function headlineBox(r){var p=outPrimary(),s=outSecondary();return '<div class="headline-box"><div class="k">'+esc(secTitle("headline",p))+'</div><div class="v">'+highlightNums(r.head[p])+"</div>"+(s?'<div class="v-sub">'+esc(r.head[s])+"</div>":"")+"</div>"}
function renderReport(r){
var b=r.buckets,html="",p=outPrimary(),s=outSecondary();
if(state.format==="weekly"){html+=headlineBox(r);html+=secHTML("done",b.done);html+=secHTML("data",b.data);html+=secHTML("impact",impactItems(r));html+=secHTML("risk",b.risk,true);html+=secHTML("next",b.next);html+=secHTML("help",b.help)}
else if(state.format==="slide"){
var t=r.head[p].replace(/^(This week's highlight: |Key result this period: |Progress highlight: |Latest update: |本週重點：|本期重點成果：|進度重點：|最新進度：|今週のハイライト：|今期の主要成果：|進捗のハイライト：|最新の進捗：)/,"");
html+='<div class="slide-title">'+highlightNums(t)+"</div>";if(s)html+='<div class="slide-title-sub">'+esc(r.head[s])+"</div>";
html+=secHTML("three",b.data.concat(b.done).slice(0,3));
var c=b.data[0]||b.done[0];if(c)html+='<div class="headline-box"><div class="k">'+esc(secTitle("concl",p))+'</div><div class="v">'+highlightNums(c[p])+"</div></div>";
html+=secHTML("notes",b.risk.concat(b.next,b.help),true)}
else if(state.format==="email"){
var u=ui();var subjBase=r.head[p].replace(/^(This week's highlight: |Key result this period: |Progress highlight: |Latest update: |本週重點：|本期重點成果：|進度重點：|最新進度：|今週のハイライト：|今期の主要成果：|進捗のハイライト：|最新の進捗：)/,"");
var subj=(r.proj?(p==="en"?r.proj+" — ":"「"+r.proj+"」"):"")+secTitle("progUp",p)+(p==="en"?": ":"：")+subjBase;
html+='<div class="email-subject">'+esc(u.subject)+(p==="en"?": ":"：")+esc(subj)+"</div>";
var greet={en:"Hi team,",zh:"Hi 各位，",ja:"関係各位"}[p];var intro={en:"Please find the progress update for this period below:",zh:"以下為本期進度更新：",ja:"今期の進捗をご報告いたします。"}[p];
var thanks={en:"Thank you,",zh:"謝謝，",ja:"よろしくお願いいたします。"}[p];
html+='<p style="margin:0 0 10px;font-size:.94rem">'+esc(greet)+"<br/>"+esc(intro)+"</p>";
html+=secHTML("done",b.done);html+=secHTML("data",b.data);html+=secHTML("impact",impactItems(r));html+=secHTML("risk",b.risk,true);html+=secHTML("next",b.next);html+=secHTML("help",b.help);
html+='<p style="margin:6px 0 0;font-size:.94rem">'+esc(thanks)+"<br/>Mao</p>"}
else{html+=headlineBox(r);html+=secHTML("myWins",b.data.concat(b.done));html+=secHTML("myBlock",b.risk,true);html+=secHTML("myAsk",b.help.concat(b.next.slice(0,2)))}
return html}
function plainText(r){
var b=r.buckets,out=[],p=outPrimary(),s=outSecondary();
function sec(key,items){if(!items.length)return;out.push("");out.push("## "+secTitle(key,p));items.forEach(function(it){out.push("- "+it[p]);if(s&&it[s]!==it[p])out.push("  "+it[s])})}
if(state.format==="email"){out.push(ui().subject+": "+r.head[p])}else{out.push(r.head[p])}
if(state.format==="oneonone"){sec("myWins",b.data.concat(b.done));sec("myBlock",b.risk);sec("myAsk",b.help.concat(b.next.slice(0,2)))}
else{sec("done",b.done);sec("data",b.data);sec("impact",impactItems(r));sec("risk",b.risk);sec("next",b.next);sec("help",b.help)}
return out.join("\n").trim()}

/* ============ UI application ============ */
var inputEl=$("input"),outputEl=$("output");
function buildSeg(id,values,labels,current,cb){
var el=$(id);el.innerHTML="";Object.keys(values).forEach(function(k){var v=values[k];var btn=document.createElement("button");btn.type="button";btn.textContent=labels?labels[k]:v;btn.setAttribute("data-val",k);if(k===current)btn.classList.add("active");btn.addEventListener("click",function(){el.querySelectorAll("button").forEach(function(x){x.classList.remove("active")});btn.classList.add("active");cb(k)});el.appendChild(btn)})}
function applyUi(){
var u=ui();document.documentElement.lang=state.ui==="zh"?"zh-Hant":state.ui==="ja"?"ja":"en";
document.title=u.title;
$("uiEyebrow").textContent=u.eyebrow;$("uiTitle").textContent=u.title;$("uiLede").textContent=u.lede;
$("uiSteps").innerHTML=u.steps.map(function(s,i){return "<span><b>"+(i+1)+"</b> "+esc(s)+"</span>"}).join("");
$("uiLangLabel").textContent=state.ui==="en"?"Language":state.ui==="zh"?"語言":"言語";
$("lblProject").textContent=u.project;$("projectName").placeholder=u.projectPh;
$("lblAudience").textContent=u.audience;$("lblFormat").textContent=u.format;$("lblOutLang").textContent=u.outLang;
$("uiInputTitle").textContent=u.inputTitle;inputEl.placeholder=u.placeholder;
$("clearBtn").textContent=u.clear;$("uiExamplesLabel").textContent=u.examples;
$("exAi").textContent=u.exAi;$("exLaunch").textContent=u.exLaunch;$("exJa").textContent=u.exJa;
$("translateBtn").textContent=u.translate;$("uiDetectedTitle").textContent=u.detected;
$("uiOutputTitle").textContent=u.outputTitle;
$("copyBtn").textContent=u.copy;$("downloadBtn").textContent=u.download;$("copyOk").textContent=u.copied;
$("uiGlossTitle").textContent=u.glossTitle;$("uiGlossSub").textContent=u.glossSub;
$("gCol1").textContent=u.g1;$("gCol2").textContent=u.g2;$("gCol3").textContent=u.g3;
$("uiTipsTitle").textContent=u.tipsTitle;$("uiTipsSub").textContent=u.tipsSub;$("uiFormula").innerHTML=u.formula;
$("uiFooter").textContent=u.footer;
$("uiCredit").textContent=u.credit;
$("tipsList").innerHTML=TIPS[state.ui].map(function(t){return '<li><span class="before">'+esc(t[0])+'</span><br/><span class="after">'+esc(t[1])+"</span></li>"}).join("");
buildSeg("segAudience",{manager:1,executive:1,cross:1,client:1},u.aud,state.audience,function(v){state.audience=v;if(lastPlainText)doTranslate()});
buildSeg("segFormat",{weekly:1,slide:1,email:1,oneonone:1},u.fmt,state.format,function(v){state.format=v;if(lastPlainText)doTranslate()});
buildSeg("segLang",{en:1,zh:1,ja:1,"en-zh":1,"en-ja":1},u.out,state.out,function(v){state.out=v;updateDetected();renderGloss();if(lastPlainText)doTranslate()});
document.querySelectorAll(".lang-switch button").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-ui")===state.ui)});
renderGloss();updateCount();updateDetected();
if(!lastPlainText){outputEl.innerHTML='<div class="report-empty"><strong>'+esc(u.emptyTitle)+"</strong><br/>"+esc(u.emptyBody)+"</div>"}
}
function renderGloss(){
var lang=outPrimary();
$("glossBody").innerHTML=GLOSSARY.map(function(g){return "<tr><td class='tech-cell'>"+esc(g.tech)+"</td><td class='biz-cell'>"+esc(pick(g,"biz",lang))+"</td><td>"+esc(pick(g,"imp",lang))+"</td></tr>"}).join("")}
function updateCount(){var v=inputEl.value;var lines=v.split(/\n+/).filter(function(l){return l.trim().length}).length;$("inputCount").textContent=ui().count(lines,v.length)}
function updateDetected(){
var terms=detectTerms(inputEl.value);var box=$("detectedChips");var lang=outPrimary();
if(!terms.length){box.innerHTML='<span class="none-note">'+esc(inputEl.value.trim()?ui().detectedNone:ui().detectedWait)+"</span>";return}
box.innerHTML=terms.map(function(g){return '<span class="chip"><b>'+esc(g.tech.split(" / ")[0])+'</b><span class="arr">→</span><i>'+esc(pick(g,"biz",lang))+"</i></span>"}).join("")}
function refreshLive(){updateCount();updateDetected()}
function doTranslate(){
var r=buildReport(inputEl.value);
if(!r){outputEl.innerHTML='<div class="report-empty"><strong>'+esc(ui().emptyInput)+"</strong></div>";$("outActions").hidden=true;return}
outputEl.innerHTML=renderReport(r);lastPlainText=plainText(r);$("outActions").hidden=false;$("copyOk").hidden=true}
document.querySelectorAll(".lang-switch button").forEach(function(b){b.addEventListener("click",function(){state.ui=b.getAttribute("data-ui");applyUi();if(lastPlainText)doTranslate()})});
document.querySelectorAll(".ex-btn").forEach(function(btn){btn.addEventListener("click",function(){inputEl.value=SAMPLES[btn.getAttribute("data-sample")];refreshLive();doTranslate();inputEl.focus()})});
$("clearBtn").addEventListener("click",function(){inputEl.value="";lastPlainText="";outputEl.innerHTML='<div class="report-empty"><strong>'+esc(ui().emptyTitle)+"</strong><br/>"+esc(ui().clearedBody)+"</div>";$("outActions").hidden=true;refreshLive();inputEl.focus()});
$("translateBtn").addEventListener("click",doTranslate);
inputEl.addEventListener("input",refreshLive);
$("projectName").addEventListener("input",function(){if(lastPlainText)doTranslate()});
$("copyBtn").addEventListener("click",function(){if(!lastPlainText)return;function done(){$("copyOk").hidden=false;setTimeout(function(){$("copyOk").hidden=true},2200)}function fb(){var ta=document.createElement("textarea");ta.value=lastPlainText;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(ta)}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lastPlainText).then(done,function(){fb();done()})}else{fb();done()}});
$("downloadBtn").addEventListener("click",function(){if(!lastPlainText)return;var blob=new Blob([lastPlainText],{type:"text/plain;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="report.txt";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},400)});
applyUi();refreshLive();
})();
</script>
</body>
</html>
